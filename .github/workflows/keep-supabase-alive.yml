name: keep-supabase-alive

# Supabase free-tier projects pause after ~7 days of inactivity. A trivial
# query every 3 days counts as activity and keeps the project awake.
# Requires the SUPABASE_DB_URL repo secret (use the IPv4 pooler URL — GitHub
# runners can't reach the IPv6-only direct db.<ref>.supabase.co host).
on:
  schedule:
    - cron: "0 6 */3 * *" # every 3rd day at 06:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to prevent free-tier pause
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DATABASE_URL" -c "select 1;"
